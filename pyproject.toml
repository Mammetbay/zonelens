[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "zonelens"
version = "0.1.0"
description = "Local video person detection and tracking"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = ["opencv-python>=4.12,<6", "ultralytics>=8.4,<9", "lap>=0.5.12,<0.6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
zonelens = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
